<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SciBot Platform{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="frame">
        <header class="topbar">
            <a href="{{ url_for('index') }}" class="brand">
                <span class="brand-mark">§</span> SciBot <span class="brand-sub">/ platform</span>
            </a>
            <nav>
                <a href="{{ url_for('index') }}">Library</a>
                <a href="{{ url_for('compare') }}">Rank</a>
            </nav>
        </header>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="flash-stack">
                    {% for message in messages %}
                        <div class="flash">{{ message }}</div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        <main>
            {% block content %}{% endblock %}
        </main>

        <footer>
            <span>local instance &middot; SQLite &middot; Claude</span>
        </footer>
    </div>
</body>
</html>
